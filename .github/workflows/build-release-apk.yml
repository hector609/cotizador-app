name: Build & Release APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # Necesario para crear Releases

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'   # Compatible con sdk: '>=3.3.0 <4.0.0'
          channel: 'stable'
          cache: true

      # El repo fue bootstrapped manualmente sin `flutter create` —
      # no tiene directorio android/. Lo generamos en el runner.
      - name: Generate android/ platform scaffolding
        run: flutter create --platforms=android --project-name cotizador_app .

      # flutter create con Flutter 3.27 genera AGP 8.1.0 y Gradle 8.3.
      # webview_flutter ^4.4.2 exige AGP 8.1.1+; usamos AGP 8.3.2 que requiere Gradle 8.4.
      # Parcheamos AGP en settings.gradle (Kotlin DSL) y Gradle wrapper.
      - name: Patch AGP 8.3.2 + Gradle 8.4 wrapper
        run: |
          echo "=== ANTES ==="
          cat android/settings.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

          # AGP en settings.gradle (nuevo formato Kotlin DSL Flutter 3.27+)
          sed -i 's/com\.android\.application" version "[0-9.]*"/com.android.application" version "8.3.2"/g' android/settings.gradle
          sed -i 's/com\.android\.library" version "[0-9.]*"/com.android.library" version "8.3.2"/g' android/settings.gradle

          # AGP en build.gradle (Groovy DSL — formato anterior, por si acaso)
          sed -i 's/com\.android\.tools\.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.3.2/g' android/build.gradle

          # Gradle wrapper: AGP 8.3.2 requiere Gradle >= 8.4
          sed -i 's|gradle-[0-9.]*-all\.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-[0-9.]*-bin\.zip|gradle-8.4-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== DESPUÉS ==="
          cat android/settings.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      # pubspec.yaml declara assets/images/ y assets/data/ como dirs de assets.
      # Flutter los acepta como dirs vacíos. Los fonts fueron removidos de pubspec.
      - name: Create stub asset directories
        run: |
          mkdir -p assets/images assets/data

      - name: flutter pub get
        run: flutter pub get

      - name: Build release APK (universal)
        run: flutter build apk --release

      - name: Build split-per-abi (más liviano por arquitectura)
        run: flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Compute tag (commit short SHA + timestamp)
        id: tag
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release tag: $TAG"

      - name: Create GitHub Release con APK assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cotizador APK ${{ steps.tag.outputs.tag }}
          body: |
            APK build automático del cotizador-app.

            **Instalación Android:**
            1. Descarga `app-release.apk` abajo
            2. En tu Android: Configuración → Seguridad → Permitir orígenes desconocidos
            3. Abre el APK descargado para instalar

            Commit: ${{ github.sha }}
          generate_release_notes: false
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
