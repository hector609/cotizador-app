name: cotizador_app
description: "Flutter app para cotizar equipos Telcel — para vendedores."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6
  # get_storage: ^2.1.1

  # API & HTTP
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI & UX
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.7.3

  # Telegram Widget
  # flutter_inappwebview: ^6.0.0  # WebView for Telegram widget
  webview_flutter: ^4.4.2

  # PDF Handling
  pdf: ^3.10.7
  printing: ^5.11.0
  share_plus: ^7.2.1

  # QR Code
  qr_flutter: ^4.1.0

  # Validation
  validators: ^3.0.0

  # Logging
  logger: ^2.0.1

  # Device Info
  device_info_plus: ^9.1.1
  connectivity_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  test: ^1.25.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  # fonts: Roboto está incluido en Flutter/Material — no se necesita declarar
  # aquí. Cuando se agreguen fuentes custom (p.ej. Inter, Poppins) agregar
  # los archivos TTF en assets/fonts/ y descomentar esta sección.
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
